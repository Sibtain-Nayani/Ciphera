version: "3.8"
services:
  backend:
    image: ${ECR_REGISTRY}/ciphera-backend:latest
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - ciphera_net
      
  celery_worker:
    image: ${ECR_REGISTRY}/ciphera-worker:latest
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=8
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - redis
    networks:
      - ciphera_net

  frontend:
    image: ${ECR_REGISTRY}/ciphera-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - ciphera_net

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - ciphera_net
      
networks:
  ciphera_net:
